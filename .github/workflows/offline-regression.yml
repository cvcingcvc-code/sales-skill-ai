name: Offline regression

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: offline-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Verify JavaScript runtime
        run: node --version
      - name: Run strict offline regression
        id: offline
        run: python scripts/run_tests.py --quiet --fail-on-skip --report-json "$RUNNER_TEMP/offline-summary.json"
      - name: Retain offline counts
        if: ${{ always() && (steps.offline.outcome == 'success' || steps.offline.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-regression
          path: ${{ runner.temp }}/offline-summary.json
          if-no-files-found: error
          retention-days: 7
